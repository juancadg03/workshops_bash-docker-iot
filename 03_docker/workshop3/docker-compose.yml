services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api1:
    build: ./api
    environment:
      INSTANCE: api-1
      DB_HOST: db
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  api2:
    build: ./api
    environment:
      INSTANCE: api-2
      DB_HOST: db
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  api3:
    build: ./api
    environment:
      INSTANCE: api-3
      DB_HOST: db
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  pgdata:
